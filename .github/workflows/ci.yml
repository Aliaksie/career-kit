name: CI
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  compiler:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm build
      - run: pnpm exec playwright install --with-deps chromium
      - run: node dist/src/cli/index.js validate --profile examples/software-engineer/profile.yaml
      - run: node dist/src/cli/index.js build --profile examples/software-engineer/profile.yaml --target generic
      - run: node dist/src/cli/index.js explain generated/cv.md
      - run: node dist/src/cli/index.js tailor --profile examples/software-engineer/profile.yaml --job examples/software-engineer/job.md --output generated/tailored
      - run: node dist/src/cli/index.js explain generated/tailored/cv.md
      - run: node dist/src/cli/index.js tailor --profile examples/software-engineer/profile.yaml --job examples/software-engineer/job.json --output generated/structured --no-pdf
      - run: npm pack --dry-run
