name: Release package
on:
  push:
    tags: ['v*']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false
jobs:
  checks:
    uses: ./.github/workflows/ci.yml
  package:
    needs: checks
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Require a version tag on main
        env:
          RELEASE_REF: ${{ github.ref }}
        run: |
          test "$RELEASE_REF" = "refs/tags/v$(node -p 'require("./package.json").version')"
          git merge-base --is-ancestor HEAD origin/main
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - name: Retain the exact package that passes isolated installation
        run: node scripts/check-package.mjs --pack-destination release
      - name: Prepare checksum and versioned notes
        run: |
          cd release
          sha256sum career-kit-*.tgz > SHA256SUMS
          cd ..
          node --input-type=module <<'NODE'
          import { readFileSync, writeFileSync } from 'node:fs';
          const { version } = JSON.parse(readFileSync('package.json', 'utf8'));
          const lines = readFileSync('CHANGELOG.md', 'utf8').split('\n');
          const start = lines.indexOf(`## ${version}`);
          if (start < 0) throw new Error('Missing versioned release notes');
          const next = lines.findIndex((line, i) => i > start && line.startsWith('## '));
          const notes = lines.slice(start + 1, next < 0 ? undefined : next).join('\n').trim();
          if (!notes) throw new Error('Empty release notes');
          writeFileSync('release/notes.md', notes + '\n');
          NODE
      - uses: actions/upload-artifact@v4
        with:
          name: release-package
          path: release/
          if-no-files-found: error
          retention-days: 7
  publish:
    needs: package
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: release-package
          path: release
      - name: Verify and publish the tested package
        working-directory: release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          GH_HOST: github.com
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          sha256sum --check SHA256SUMS
          gh release create "$RELEASE_TAG" career-kit-*.tgz SHA256SUMS pack.json \
            --verify-tag --title "$RELEASE_TAG" --notes-file notes.md
